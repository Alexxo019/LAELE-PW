<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style_index.css">

    <title> Cadrasto </title>
</head>

<body>

    <div id="pai"> 

        <main id="cartao">

            <form>

                <div class="futebol">
                    <label for="nome"> Nome completo: </label>
                    <input type="text" id="nome" placeholder="Escreva seu nome aqui..." required class="texto">
                </div>

                <div class="futebol">
                <label for="email"> Email: </label>
                <input type="email" id="email" placeholder="IInsira seu email aqui..." required class="texto">
                </div>

                <div class="futebol">
                <label for="senha"> Crie uma senha: </label>
                <input type="password" id="senha" placeholder="Insira sua senha aqui..." required class="texto">
                </div>

                <div class="futebol">
                <label for="senha"> Confirme a senha: </label>
                <input type="password" id="senha" placeholder="Repita sua senha..." required class="texto">
                </div>


                <div id="botoes">
                <button type="reset" id="kank" class="botao"> Cancelar </button>
                <button type="submit" id="son" class="botao"> Confirmar </button>
                </div>

            </form> 

        </main>

    </div>
